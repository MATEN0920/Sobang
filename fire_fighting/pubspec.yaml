name: fire_fighting
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  path_provider: ^2.0.14
  file_picker: ^10.2.1
  image_picker: ^1.0.4

  # 지도 및 위치 관련
  kakao_map_plugin: ^0.3.7
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  
  # HTTP 통신
  http: ^1.1.0
  dio: ^5.3.2
  
  # URL 실행 (길찾기용)
  url_launcher: ^6.2.2
  
  # UI 관련
  cupertino_icons: ^1.0.8
  json_annotation: ^4.8.1
  webview_flutter: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quiz.json
    - assets/shelters.json
    - assets/maps/fire_risk_priority.html
    - assets/maps/avg_fire_accidents.html
    - assets/maps/avg_casualties.html
    - assets/maps/avg_fire_control_targets.html
    - assets/maps/avg_fire_equipment_failures.html
    - assets/maps/old_houses_count.html